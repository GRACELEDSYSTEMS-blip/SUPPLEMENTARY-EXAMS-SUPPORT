<script>
const B=[{"topic":"Poisson Distribution","stem":"A casualty unit receives an average of 3.2 emergency cases per hour. Assuming arrivals follow a Poisson process, what is the probability that exactly 5 cases arrive in the next 90 minutes?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.175","dp":3,"aliases":[],"options":[],"solution":"**Step 1: Identify the model.** We are counting independent arrivals in a fixed time interval, so a Poisson model is appropriate.\n\nThe quoted rate is 3.2 cases per hour, but the question asks about 90 minutes = 1.5 hours. Therefore the Poisson mean for the required interval is\n\n\\[\n\\lambda=(3.2)(1.5)=4.8.\n\\]\n\n**Step 2: Translate the wording.** “Exactly 5” means \\(P(X=5)\\).\n\n\\[\nP(X=x)=\\frac{e^{-\\lambda}\\lambda^x}{x!}\n\\]\n\n\\[\nP(X=5)=\\frac{e^{-4.8}(4.8)^5}{5!}=0.174748.\n\\]\n\nHence, to 3 decimal places,\n\n\\[\n\\boxed{0.175}\n\\]\n\n**Exam cue:** always convert the given rate to the same time interval as the question before using the Poisson formula."}]},{"topic":"Poisson Distribution","stem":"A laboratory records an average of 6 specimen-label errors every 3 hours. If errors follow a Poisson process, find the probability of at least one error during a 40-minute period.","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.736","dp":3,"aliases":[],"options":[],"solution":"The rate is 6 errors per 3 hours, so the hourly rate is \\(6/3=2\\).\n\nForty minutes is \\(40/60=2/3\\) hour, hence\n\n\\[\n\\lambda=2\\left(\\frac23\\right)=\\frac43\\approx1.3333.\n\\]\n\n“At least one” is easier by the complement:\n\n\\[\nP(X\\ge1)=1-P(X=0)=1-e^{-\\lambda}.\n\\]\n\n\\[\nP(X\\ge1)=1-e^{-4/3}=0.736403.\n\\]\n\n\\[\n\\boxed{0.736}\n\\]\n\n**Why the complement matters:** calculating \\(P(1)+P(2)+\\cdots\\) would be an infinite sum. The only excluded outcome is zero."}]},{"topic":"Poisson Distribution","stem":"Two independent clinics send urgent samples to one laboratory. Clinic A sends an average of 1.8 urgent samples per hour and Clinic B sends 2.7 per hour. What is the probability that exactly 10 urgent samples arrive from the two clinics combined during a 2-hour period?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.119","dp":3,"aliases":[],"options":[],"solution":"For **independent Poisson processes**, the combined process is Poisson with rate equal to the sum of the rates.\n\n\\[\n\\text{combined hourly rate}=1.8+2.7=4.5.\n\\]\n\nOver 2 hours,\n\n\\[\n\\lambda=(4.5)(2)=9.\n\\]\n\nThe question asks for exactly 10:\n\n\\[\nP(X=10)=\\frac{e^{-9}9^{10}}{10!}=0.118580.\n\\]\n\n\\[\n\\boxed{0.119}\n\\]\n\n**Exam cue:** when two independent event streams are combined, first add their rates, then adjust for the requested time interval."}]},{"topic":"Poisson Distribution","stem":"A ward experiences a mean of 4.5 call-bell alarms per hour. Assuming a Poisson distribution, what is the probability that at most 2 alarms occur in the next hour?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.174","dp":3,"aliases":[],"options":[],"solution":"“At most 2” means \\(X\\le2\\), so include 0, 1 and 2:\n\n\\[\nP(X\\le2)=P(0)+P(1)+P(2).\n\\]\n\nWith \\(\\lambda=4.5\\),\n\n\\[\nP(X\\le2)=e^{-4.5}\\left[1+4.5+\\frac{4.5^2}{2!}\\right]\n=0.173578.\n\\]\n\n\\[\n\\boxed{0.174}\n\\]\n\n**Language check:** “at most 2” includes 2. Do not calculate \\(P(X<2)\\)."}]},{"topic":"Poisson Distribution","stem":"The number of contaminated cultures in a batch follows a Poisson distribution with mean 2.4. What is the probability that more than 3 cultures are contaminated?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.221","dp":3,"aliases":[],"options":[],"solution":"“More than 3” means \\(X>3\\), i.e. \\(X\\ge4\\).\n\nUse the complement:\n\n\\[\nP(X>3)=1-P(X\\le3).\n\\]\n\n\\[\nP(X\\le3)=e^{-2.4}\\left[1+2.4+\\frac{2.4^2}{2!}+\\frac{2.4^3}{3!}\\right].\n\\]\n\nTherefore\n\n\\[\nP(X>3)=0.221277\n\\]\n\nand\n\n\\[\n\\boxed{0.221}.\n\\]\n\n**Exam cue:** translate the words before calculating: “more than 3” excludes 3."}]},{"topic":"Poisson Distribution","stem":"A pharmacy receives an average of 5 urgent prescription requests in 30 minutes. Find the probability that between 3 and 6 requests inclusive are received in a 30-minute period.","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.638","dp":3,"aliases":[],"options":[],"solution":"Here \\(\\lambda=5\\). “Between 3 and 6 inclusive” means\n\n\\[\nP(3\\le X\\le6)=P(3)+P(4)+P(5)+P(6).\n\\]\n\nThus\n\n\\[\nP(3\\le X\\le6)=\\sum_{x=3}^6\\frac{e^{-5}5^x}{x!}\n=0.637531.\n\\]\n\n\\[\n\\boxed{0.638}\n\\]\n\nThe word **inclusive** is important: both 3 and 6 must be included."}]},{"topic":"Poisson Distribution","stem":"During a 6-hour observation period, a clinic recorded an expected total of 18 walk-in emergencies. Under a constant-rate Poisson model, what is the probability of exactly 2 emergencies in a particular 90-minute interval?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.112","dp":3,"aliases":[],"options":[],"solution":"The question does not give \\(\\lambda\\) directly for 90 minutes.\n\nFrom 18 events in 6 hours,\n\n\\[\n\\text{rate}=\\frac{18}{6}=3\\text{ per hour}.\n\\]\n\nNinety minutes = 1.5 hours, so\n\n\\[\n\\lambda=(3)(1.5)=4.5.\n\\]\n\nThen\n\n\\[\nP(X=2)=\\frac{e^{-4.5}4.5^2}{2!}=0.112479.\n\\]\n\n\\[\n\\boxed{0.112}.\n\\]\n\n**Key skill:** derive the parameter for the interval being asked about; do not use 18 as \\(\\lambda\\)."}]},{"topic":"Poisson Distribution","stem":"Two independent machines generate processing faults at mean rates of 0.8 and 1.2 faults per hour respectively. What is the probability that neither machine generates any fault during the next 3 hours?","parts":[{"label":"Answer (4 d.p.)","kind":"number","answer":"0.0025","dp":4,"aliases":[],"options":[],"solution":"Combine the independent Poisson rates:\n\n\\[\n0.8+1.2=2.0\\text{ faults/hour}.\n\\]\n\nFor 3 hours,\n\n\\[\n\\lambda=(2.0)(3)=6.\n\\]\n\n“Neither machine generates any fault” means zero faults in the combined process:\n\n\\[\nP(X=0)=e^{-6}=0.00247875.\n\\]\n\n\\[\n\\boxed{0.0025}.\n\\]\n\nThis is equivalent to multiplying the two independent zero-fault probabilities, but combining the rates is faster."}]},{"topic":"Poisson Distribution","stem":"Calls to a medical helpline follow a Poisson process at 2.5 calls per hour. What is the probability of no calls in the first hour and exactly 3 calls in the second hour?","parts":[{"label":"Answer (4 d.p.)","kind":"number","answer":"0.0175","dp":4,"aliases":[],"options":[],"solution":"Counts in **disjoint intervals of a Poisson process are independent**.\n\nFor each 1-hour interval, \\(\\lambda=2.5\\).\n\n\\[\nP(X_1=0)=e^{-2.5},\n\\]\n\nand\n\n\\[\nP(X_2=3)=\\frac{e^{-2.5}2.5^3}{3!}.\n\\]\n\nTherefore\n\n\\[\nP(X_1=0, X_2=3)=P(X_1=0)P(X_2=3)\n=0.01754674.\n\\]\n\n\\[\n\\boxed{0.0175}.\n\\]\n\nThe trap is to treat the two-hour total as the only event; the question specifies what must happen in each separate hour."}]},{"topic":"Poisson Distribution","stem":"Independent adverse-event reports arrive from Centre A at 1.5 per hour and Centre B at 4 per hour. Centre A is observed for 2 hours while Centre B is observed for only 30 minutes. What is the probability of exactly 4 reports in total across the two observations?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.175","dp":3,"aliases":[],"options":[],"solution":"The observation times are different, so convert each source separately.\n\nCentre A:\n\n\\[\n\\lambda_A=(1.5)(2)=3.\n\\]\n\nCentre B: 30 minutes = 0.5 hour,\n\n\\[\n\\lambda_B=(4)(0.5)=2.\n\\]\n\nIndependent Poisson counts add:\n\n\\[\n\\lambda_T=3+2=5.\n\\]\n\nThus\n\n\\[\nP(X=4)=\\frac{e^{-5}5^4}{4!}=0.175467.\n\\]\n\n\\[\n\\boxed{0.175}.\n\\]\n\n**Trap:** do not add the hourly rates first when the two sources are observed for different lengths of time."}]},{"topic":"Poisson Distribution","stem":"The number of medication errors per shift is Poisson with mean 1.2. Over 20 independent shifts, how many shifts would you expect to have at least 2 medication errors?","parts":[{"label":"Answer (2 d.p.)","kind":"number","answer":"6.75","dp":2,"aliases":[],"options":[],"solution":"First find the probability that a single shift has at least 2 errors.\n\n\\[\nP(X\\ge2)=1-P(X\\le1)\n=1-[P(0)+P(1)].\n\\]\n\nWith \\(\\lambda=1.2\\),\n\n\\[\nP(X\\ge2)=1-e^{-1.2}(1+1.2)=0.337373.\n\\]\n\nAcross 20 shifts, the **expected number** of such shifts is\n\n\\[\n20\\times P(X\\ge2)=20(0.337373)=6.747455.\n\\]\n\n\\[\n\\boxed{6.75}\\text{ shifts (expected)}.\n\\]\n\nThis question has two layers: a Poisson probability first, then an expected count across repeated shifts."}]},{"topic":"Poisson Distribution","stem":"For a Poisson-distributed number of incidents per day, the probability of zero incidents is 0.20. Find the probability of exactly 2 incidents in a day.","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.259","dp":3,"aliases":[],"options":[],"solution":"Here \\(\\lambda\\) is hidden.\n\nFor a Poisson variable,\n\n\\[\nP(X=0)=e^{-\\lambda}.\n\\]\n\nGiven \\(P(X=0)=0.20\\),\n\n\\[\ne^{-\\lambda}=0.20\n\\]\n\nso\n\n\\[\n\\lambda=-\\ln(0.20)=1.609438.\n\\]\n\nNow calculate\n\n\\[\nP(X=2)=\\frac{e^{-\\lambda}\\lambda^2}{2!}\n=0.259029.\n\\]\n\n\\[\n\\boxed{0.259}.\n\\]\n\n**High-yield twist:** the mean is not always stated; sometimes you must recover it from a probability first."}]},{"topic":"Poisson Distribution","stem":"For a Poisson variable X, the probability of exactly one event is 2.3 times the probability of zero events. Find P(X ≥ 3).","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.404","dp":3,"aliases":[],"options":[],"solution":"For a Poisson variable,\n\n\\[\nP(0)=e^{-\\lambda},\\qquad\nP(1)=e^{-\\lambda}\\lambda.\n\\]\n\nTherefore\n\n\\[\n\\frac{P(1)}{P(0)}=\\lambda.\n\\]\n\nThe question says this ratio is 2.3, so\n\n\\[\n\\lambda=2.3.\n\\]\n\nNow\n\n\\[\nP(X\\ge3)=1-P(X\\le2)\n\\]\n\n\\[\n=1-e^{-2.3}\\left(1+2.3+\\frac{2.3^2}{2!}\\right)\n=0.403961.\n\\]\n\n\\[\n\\boxed{0.404}.\n\\]\n\nThis is a parameter-identification question before it becomes a probability question."}]},{"topic":"Poisson Distribution","stem":"A histology slide has an average of 2.4 artefacts per 100 microscopic fields. Assuming a Poisson model and a constant rate, what is the probability of exactly 8 artefacts in 250 fields?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.103","dp":3,"aliases":[],"options":[],"solution":"Poisson rates can apply to **space/exposure**, not only time.\n\nThe mean for 250 fields is\n\n\\[\n\\lambda=2.4\\left(\\frac{250}{100}\\right)=6.\n\\]\n\nHence\n\n\\[\nP(X=8)=\\frac{e^{-6}6^8}{8!}=0.103258.\n\\]\n\n\\[\n\\boxed{0.103}.\n\\]\n\nThe same rate-conversion principle used for minutes and hours applies to fields, area, distance or volume."}]},{"topic":"Poisson Distribution","stem":"A hospital receives a mean of 9 trauma referrals per 24 hours. Under a constant-rate Poisson model, what is the probability of at least 5 referrals during an 8-hour night shift?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.185","dp":3,"aliases":[],"options":[],"solution":"Convert the 24-hour mean to the 8-hour shift:\n\n\\[\n\\lambda=9\\left(\\frac8{24}\\right)=3.\n\\]\n\n“At least 5” means \\(X\\ge5\\). Use the complement:\n\n\\[\nP(X\\ge5)=1-P(X\\le4)\n\\]\n\n\\[\n=1-\\sum_{x=0}^4\\frac{e^{-3}3^x}{x!}\n=0.184737.\n\\]\n\n\\[\n\\boxed{0.185}.\n\\]\n\nDo not use \\(\\lambda=9\\); that mean belongs to a full 24-hour period."}]},{"topic":"Poisson Distribution","stem":"A reception desk receives patients according to a Poisson process at 4 patients per hour. What is the probability that exactly one patient arrives in each of two consecutive 30-minute intervals?","parts":[{"label":"Answer (4 d.p.)","kind":"number","answer":"0.0733","dp":4,"aliases":[],"options":[],"solution":"Each 30-minute interval has\n\n\\[\n\\lambda=4(0.5)=2.\n\\]\n\nFor one interval,\n\n\\[\nP(X=1)=e^{-2}(2).\n\\]\n\nThe two disjoint intervals are independent, so\n\n\\[\nP(1\\text{ in first and }1\\text{ in second})\n=[2e^{-2}]^2=0.07326256.\n\\]\n\n\\[\n\\boxed{0.0733}.\n\\]\n\nNotice that this is **not** the same event as simply having 2 patients in the whole hour; the question requires one in each half-hour."}]},{"topic":"Poisson Distribution","stem":"A monitoring system records false alerts from Sensor A at 0.6 per hour for 5 hours and from independent Sensor B at 1.4 per hour for 2 hours. What is the probability that the total number of false alerts from both observation periods is at most 4?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.313","dp":3,"aliases":[],"options":[],"solution":"Find the mean count contributed by each observation:\n\n\\[\n\\lambda_A=(0.6)(5)=3,\n\\qquad\n\\lambda_B=(1.4)(2)=2.8.\n\\]\n\nBecause the counts are independent Poisson variables,\n\n\\[\n\\lambda_T=3+2.8=5.8.\n\\]\n\n“At most 4” means\n\n\\[\nP(X\\le4)=\\sum_{x=0}^4\\frac{e^{-5.8}5.8^x}{x!}\n=0.312718.\n\\]\n\n\\[\n\\boxed{0.313}.\n\\]\n\nThe rates cannot simply be added because the observation durations differ; convert each to a mean count first."}]},{"topic":"Poisson Distribution","stem":"The number of needle-stick incidents in a month is Poisson with mean 1.7. Given that at least one incident occurred in a particular month, what is the probability that exactly one incident occurred?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.380","dp":3,"aliases":[],"options":[],"solution":"This is a **conditional probability** question.\n\nWe need\n\n\\[\nP(X=1\\mid X\\ge1)\n=\\frac{P(X=1)}{P(X\\ge1)},\n\\]\n\nbecause \\(X=1\\) is contained within \\(X\\ge1\\).\n\nWith \\(\\lambda=1.7\\),\n\n\\[\nP(X=1)=e^{-1.7}(1.7),\n\\]\n\nand\n\n\\[\nP(X\\ge1)=1-P(X=0)=1-e^{-1.7}.\n\\]\n\nTherefore\n\n\\[\nP(X=1\\mid X\\ge1)\n=\\frac{1.7e^{-1.7}}{1-e^{-1.7}}\n=0.379978.\n\\]\n\n\\[\n\\boxed{0.380}.\n\\]\n\nThe denominator changes because the question tells us that zero incidents is no longer possible."}]},{"topic":"Poisson Distribution","stem":"A diagnostic centre receives test requests according to a Poisson process at 2.2 requests per hour. What is the variance of the number of requests received in a 4-hour period?","parts":[{"label":"Answer (1 d.p.)","kind":"number","answer":"8.8","dp":1,"aliases":[],"options":[],"solution":"For a Poisson random variable,\n\n\\[\nE(X)=\\lambda\n\\quad\\text{and}\\quad\n\\operatorname{Var}(X)=\\lambda.\n\\]\n\nOver 4 hours,\n\n\\[\n\\lambda=(2.2)(4)=8.8.\n\\]\n\nTherefore\n\n\\[\n\\operatorname{Var}(X)=8.8.\n\\]\n\n\\[\n\\boxed{8.8}\n\\]\n\n**Exam distinction:** for a Poisson distribution the **variance equals the mean**, while the standard deviation is \\(\\sqrt{\\lambda}\\)."}]},{"topic":"Poisson Distribution","stem":"The daily number of requests for a particular laboratory test is Poisson with mean 12. What is the standard deviation of the daily number of requests?","parts":[{"label":"Answer (2 d.p.)","kind":"number","answer":"3.46","dp":2,"aliases":[],"options":[],"solution":"For \\(X\\sim\\operatorname{Poisson}(\\lambda)\\),\n\n\\[\n\\operatorname{Var}(X)=\\lambda.\n\\]\n\nHere \\(\\lambda=12\\), so\n\n\\[\n\\sigma=\\sqrt{\\operatorname{Var}(X)}=\\sqrt{12}=3.464102.\n\\]\n\n\\[\n\\boxed{3.46}.\n\\]\n\nDo not report 12 as the standard deviation: 12 is both the mean and the **variance**."}]},{"topic":"Poisson Distribution","stem":"During a one-hour surveillance period, Ward A is observed for the first 15 minutes and Ward B for the remaining 45 minutes. Incident rates are 3 per hour in Ward A and 1.5 per hour in Ward B, with independent Poisson processes. What is the probability of at least 2 incidents across the full surveillance period?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.559","dp":3,"aliases":[],"options":[],"solution":"The hour is split between two wards with different rates.\n\nWard A: 15 minutes = 0.25 hour,\n\n\\[\n\\lambda_A=3(0.25)=0.75.\n\\]\n\nWard B: 45 minutes = 0.75 hour,\n\n\\[\n\\lambda_B=1.5(0.75)=1.125.\n\\]\n\nThe independent counts add:\n\n\\[\n\\lambda_T=0.75+1.125=1.875.\n\\]\n\n“At least 2” means\n\n\\[\nP(X\\ge2)=1-P(X\\le1)\n=1-e^{-1.875}(1+1.875)\n=0.559104.\n\\]\n\n\\[\n\\boxed{0.559}.\n\\]\n\nThis is the type of question where the main difficulty is constructing the correct \\(\\lambda\\) before touching the Poisson formula."}]},{"topic":"Normal Distribution & Z-scores","stem":"Systolic blood pressure in a population is normally distributed with mean 120 mmHg and standard deviation 15 mmHg. What proportion of individuals have systolic pressure above 145 mmHg?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.048","dp":3,"aliases":[],"options":[],"solution":"Let \\(X\\sim N(120,15^2)\\).\n\nStandardize the cutoff:\n\n\\[\nz=\\frac{145-120}{15}=1.6667.\n\\]\n\nThe question asks for the **right tail**:\n\n\\[\nP(X>145)=P(Z>1.6667)=1-\\Phi(1.6667).\n\\]\n\nUsing the standard normal table,\n\n\\[\nP(X>145)=0.047790.\n\\]\n\n\\[\n\\boxed{0.048}.\n\\]\n\n**Exam cue:** “above” or “greater than” means a right-tail probability."}]},{"topic":"Normal Distribution & Z-scores","stem":"Fasting glucose in a reference population is approximately normal with mean 70 mg/dL and standard deviation 8 mg/dL. What proportion is below 58 mg/dL?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.067","dp":3,"aliases":[],"options":[],"solution":"\\[\nz=\\frac{58-70}{8}=-1.50.\n\\]\n\n“Below 58” is a **left-tail** probability:\n\n\\[\nP(X<58)=P(Z<-1.50)=\\Phi(-1.50).\n\\]\n\nFrom the standard normal table,\n\n\\[\nP(X<58)=0.066807.\n\\]\n\n\\[\n\\boxed{0.067}.\n\\]\n\nA negative \\(z\\)-score simply means the value lies below the mean."}]},{"topic":"Normal Distribution & Z-scores","stem":"A laboratory measurement is normally distributed with mean 50 units and standard deviation 6 units. Find the probability that a randomly selected value lies between 44 and 59 units.","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.775","dp":3,"aliases":[],"options":[],"solution":"Standardize **both** limits:\n\n\\[\nz_1=\\frac{44-50}{6}=-1.00,\n\\qquad\nz_2=\\frac{59-50}{6}=1.50.\n\\]\n\nTherefore\n\n\\[\nP(44<X<59)=P(-1<Z<1.5)\n\\]\n\n\\[\n=\\Phi(1.5)-\\Phi(-1.0)\n=0.774538.\n\\]\n\n\\[\n\\boxed{0.775}.\n\\]\n\nFor a “between” question, subtract the cumulative area at the lower standardized limit from that at the upper limit."}]},{"topic":"Normal Distribution & Z-scores","stem":"A cognitive test score is normally distributed with mean 100 and standard deviation 12. Approximately what score marks the 90th percentile?","parts":[{"label":"Answer (1 d.p.)","kind":"number","answer":"115.4","dp":1,"aliases":[],"options":[],"solution":"The 90th percentile means\n\n\\[\nP(X\\le x)=0.90.\n\\]\n\nFrom the standard normal table, the corresponding value is approximately\n\n\\[\nz_{0.90}\\approx1.282.\n\\]\n\nReverse the standardization formula:\n\n\\[\nx=\\mu+z\\sigma.\n\\]\n\n\\[\nx=100+(1.2816)(12)=115.3786.\n\\]\n\n\\[\n\\boxed{115.4}.\n\\]\n\nHere the probability is given and the raw score is unknown—the reverse of the usual z-score question."}]},{"topic":"Normal Distribution & Z-scores","stem":"Serum marker values are normally distributed with mean 85 units and standard deviation 10 units. What value cuts off the lowest 5% of the population?","parts":[{"label":"Answer (1 d.p.)","kind":"number","answer":"68.6","dp":1,"aliases":[],"options":[],"solution":"The lowest 5% corresponds to\n\n\\[\nP(X\\le x)=0.05.\n\\]\n\nThe standard normal 5th percentile is approximately\n\n\\[\nz=-1.645.\n\\]\n\nThus\n\n\\[\nx=\\mu+z\\sigma\n=85+(-1.6449)(10)\n=68.5515.\n\\]\n\n\\[\n\\boxed{68.6}.\n\\]\n\nBecause this is a lower-tail percentile, the z-value must be negative."}]},{"topic":"Normal Distribution & Z-scores","stem":"A physiological measurement is normally distributed with mean 30 units and standard deviation 4 units. Determine the interval containing the central 95% of values.","parts":[{"label":"Lower limit (2 d.p.)","kind":"number","answer":"22.16","dp":2,"aliases":[],"options":[],"solution":"The central 95% of a normal distribution leaves 2.5% in each tail, corresponding approximately to \\(z=-1.96\\) and \\(z=+1.96\\).\n\nLower limit:\n\n\\[\nx_L=\\mu-1.96\\sigma=30-1.96(4)=22.16.\n\\]\n\n\\[\n\\boxed{22.16}\n\\]"},{"label":"Upper limit (2 d.p.)","kind":"number","answer":"37.84","dp":2,"aliases":[],"options":[],"solution":"Upper limit:\n\n\\[\nx_U=\\mu+1.96\\sigma=30+1.96(4)=37.84.\n\\]\n\n\\[\n\\boxed{37.84}\n\\]\n\nSo the central 95% is approximately \\(22.16\\) to \\(37.84\\) units. This uses the standard normal fact that about 95% lies within \\(1.96\\) standard deviations of the mean."}]},{"topic":"Normal Distribution & Z-scores","stem":"Adult resting pulse rate is modeled as normal with mean 64 beats/min and standard deviation 5 beats/min. What proportion lies between 59 and 69 beats/min?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.683","dp":3,"aliases":[],"options":[],"solution":"The two limits are exactly one standard deviation below and above the mean:\n\n\\[\nz_1=\\frac{59-64}5=-1,\n\\qquad\nz_2=\\frac{69-64}5=1.\n\\]\n\nHence\n\n\\[\nP(59<X<69)=P(-1<Z<1)\n=\\Phi(1)-\\Phi(-1)\n=0.682689.\n\\]\n\n\\[\n\\boxed{0.683}.\n\\]\n\nThis is the familiar central region within one standard deviation of the mean."}]},{"topic":"Normal Distribution & Z-scores","stem":"A biomarker is normally distributed with mean 200 and standard deviation 20. What proportion of observations fall outside the interval 170 to 230?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.134","dp":3,"aliases":[],"options":[],"solution":"Standardize the limits:\n\n\\[\nz_1=\\frac{170-200}{20}=-1.5,\n\\qquad\nz_2=\\frac{230-200}{20}=1.5.\n\\]\n\n“Outside” means the **two tails**:\n\n\\[\nP(X<170)+P(X>230)\n\\]\n\n\\[\n=\\Phi(-1.5)+[1-\\Phi(1.5)]\n=0.133614.\n\\]\n\n\\[\n\\boxed{0.134}.\n\\]\n\nBecause the limits are symmetric around the mean, the two tail areas are equal."}]},{"topic":"Normal Distribution & Z-scores","stem":"A normally distributed score has mean 50. A score of 62 is at the 90th percentile. Estimate the standard deviation.","parts":[{"label":"Answer (2 d.p.)","kind":"number","answer":"9.36","dp":2,"aliases":[],"options":[],"solution":"At the 90th percentile,\n\n\\[\nz\\approx1.2816.\n\\]\n\nUse\n\n\\[\nz=\\frac{x-\\mu}{\\sigma}.\n\\]\n\nSubstitute \\(x=62\\) and \\(\\mu=50\\):\n\n\\[\n1.2816=\\frac{62-50}{\\sigma}\n=\\frac{12}{\\sigma}.\n\\]\n\nTherefore\n\n\\[\n\\sigma=\\frac{12}{1.2816}\n=9.363650.\n\\]\n\n\\[\n\\boxed{9.36}.\n\\]\n\nThis is a reverse z-score problem: the percentile supplies \\(z\\), and the unknown is \\(\\sigma\\)."}]},{"topic":"Normal Distribution & Z-scores","stem":"In a normal distribution with standard deviation 7, a value of 84 has z-score +1.00. What is the mean?","parts":[{"label":"Answer (1 d.p.)","kind":"number","answer":"77.0","dp":1,"aliases":[],"options":[],"solution":"Start with\n\n\\[\nz=\\frac{x-\\mu}{\\sigma}.\n\\]\n\nSubstitute:\n\n\\[\n1=\\frac{84-\\mu}{7}.\n\\]\n\nThus\n\n\\[\n7=84-\\mu\n\\]\n\nand\n\n\\[\n\\mu=77.\n\\]\n\n\\[\n\\boxed{77.0}\n\\]\n\nA positive z-score of 1 means the observation is exactly one standard deviation above the mean."}]},{"topic":"Normal Distribution & Z-scores","stem":"Exam scores are normally distributed with mean 72 and standard deviation 9. In a class population of 500 students, approximately how many would be expected to score above 90?","parts":[{"label":"Answer (1 d.p.)","kind":"number","answer":"11.4","dp":1,"aliases":[],"options":[],"solution":"First convert 90 to a z-score:\n\n\\[\nz=\\frac{90-72}9=2.00.\n\\]\n\nThe upper-tail probability is\n\n\\[\nP(X>90)=P(Z>2)=1-\\Phi(2)\n=0.022750.\n\\]\n\nFor 500 students, the expected number is\n\n\\[\n500(0.022750)=11.375066.\n\\]\n\n\\[\n\\boxed{11.4}\\text{ students (expected)}.\n\\]\n\nThis is a two-stage problem: obtain a normal probability first, then convert that proportion into an expected count."}]},{"topic":"Normal Distribution & Z-scores","stem":"A measurement follows N(40, 3²). What raw value corresponds approximately to the 75th percentile?","parts":[{"label":"Answer (2 d.p.)","kind":"number","answer":"42.02","dp":2,"aliases":[],"options":[],"solution":"The 75th percentile has cumulative probability 0.75, giving\n\n\\[\nz_{0.75}\\approx0.6745.\n\\]\n\nThen\n\n\\[\nx=\\mu+z\\sigma\n=40+(0.6745)(3)\n=42.023469.\n\\]\n\n\\[\n\\boxed{42.02}.\n\\]\n\nSince 75% is above the median percentile of 50%, the z-score should be positive."}]},{"topic":"Normal Distribution & Z-scores","stem":"Student A scores 78 on a test with mean 66 and SD 6. Student B scores 92 on another test with mean 80 and SD 10. By how much does Student A's z-score exceed Student B's z-score?","parts":[{"label":"Answer (2 d.p.)","kind":"number","answer":"0.80","dp":2,"aliases":[],"options":[],"solution":"Standardize each score.\n\nStudent A:\n\n\\[\nz_A=\\frac{78-66}6=2.00.\n\\]\n\nStudent B:\n\n\\[\nz_B=\\frac{92-80}{10}=1.20.\n\\]\n\nDifference:\n\n\\[\nz_A-z_B=2.00-1.20=0.80.\n\\]\n\n\\[\n\\boxed{0.80}\n\\]\n\nAlthough Student B has the larger raw score, Student A is farther above the mean of the relevant distribution. Z-scores allow comparison across different scales."}]},{"topic":"Normal Distribution & Z-scores","stem":"A normally distributed variable has mean 100 and standard deviation 16. What is the probability that a randomly selected observation is within 10 units of the mean?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.468","dp":3,"aliases":[],"options":[],"solution":"“Within 10 units of the mean” means\n\n\\[\n90<X<110.\n\\]\n\nThe standardized distance is\n\n\\[\nz=\\frac{10}{16}=0.625.\n\\]\n\nTherefore\n\n\\[\nP(90<X<110)=P(-0.625<Z<0.625)\n\\]\n\n\\[\n=\\Phi(0.625)-\\Phi(-0.625)\n=0.468029.\n\\]\n\n\\[\n\\boxed{0.468}.\n\\]\n\nThe phrase “within” creates a central interval, not a one-tailed probability."}]},{"topic":"Normal Distribution & Z-scores","stem":"A clinical measurement is normal with mean 150 and standard deviation 18. Find the cutoff above which the highest 2.5% of observations lie.","parts":[{"label":"Answer (1 d.p.)","kind":"number","answer":"185.3","dp":1,"aliases":[],"options":[],"solution":"If 2.5% lie **above** the cutoff, then 97.5% lie below it:\n\n\\[\nP(X\\le x)=0.975.\n\\]\n\nThe corresponding standard normal value is approximately\n\n\\[\nz=1.96.\n\\]\n\nThus\n\n\\[\nx=\\mu+z\\sigma\n=150+(1.96)(18)\n=185.2794.\n\\]\n\n\\[\n\\boxed{185.3}.\n\\]\n\nThe common trap is to use the 2.5th-percentile z-score \\(-1.96\\) instead of the 97.5th-percentile value \\(+1.96\\)."}]},{"topic":"Normal Distribution & Z-scores","stem":"A lab variable is N(10, 2²). A result is flagged if it is below 7 or above 14. What proportion of results are expected to be flagged?","parts":[{"label":"Answer (4 d.p.)","kind":"number","answer":"0.0896","dp":4,"aliases":[],"options":[],"solution":"Standardize each cutoff:\n\n\\[\nz_1=\\frac{7-10}2=-1.5,\n\\qquad\nz_2=\\frac{14-10}2=2.0.\n\\]\n\nThe flagging rule includes **two unequal tails**:\n\n\\[\nP(X<7\\text{ or }X>14)\n=P(Z<-1.5)+P(Z>2).\n\\]\n\n\\[\n=\\Phi(-1.5)+[1-\\Phi(2)]\n=0.08955733.\n\\]\n\n\\[\n\\boxed{0.0896}.\n\\]\n\nDo not double one tail: the cutoffs are not equally far from the mean."}]},{"topic":"Normal Distribution & Z-scores","stem":"Length of hospital stay is approximated by a normal model with mean 25 hours and standard deviation 4 hours. What is the probability that a stay lasts more than 23 hours but no more than 31 hours?","parts":[{"label":"Answer (3 d.p.)","kind":"number","answer":"0.625","dp":3,"aliases":[],"options":[],"solution":"Translate the wording:\n\n\\[\n23<X\\le31.\n\\]\n\nFor a continuous distribution, inclusion of the endpoint does not change the probability.\n\nStandardize:\n\n\\[\nz_1=\\frac{23-25}4=-0.5,\n\\qquad\nz_2=\\frac{31-25}4=1.5.\n\\]\n\nThus\n\n\\[\nP(23<X\\le31)\n=\\Phi(1.5)-\\Phi(-0.5)\n=0.624655.\n\\]\n\n\\[\n\\boxed{0.625}.\n\\]\n\nThe important step is identifying that this is an area **between two z-scores**, not a single tail."}]}];let S=[],i=0,state={};const $=x=>document.getElementById(x);
function home(){$('home').classList.remove('hidden');$('quiz').classList.add('hidden');scrollTo(0,0)}
function start(t){S=t==='all'?[...B]:B.filter(q=>q.topic===t);i=0;state={};$('home').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){let q=S[i];$('meta').textContent=q.topic;$('qn').textContent=`${i+1} / ${S.length}`;$('bar').style.width=`${(i+1)/S.length*100}%`;$('stem').textContent=q.stem;$('parts').innerHTML=q.parts.map((p,j)=>`<div class=part><b>${p.label}</b><br><input class=ans id=a${j} inputmode=decimal placeholder="Type your answer"><div id=f${j}></div></div>`).join('');(state[i]||[]).forEach((v,j)=>{if(v!==undefined)$('a'+j).value=v});if(state['m'+i])showSolutions();if(window.MathJax)MathJax.typesetPromise()}
function norm(s){return String(s).trim().toLowerCase()}
function mark(){let q=S[i];state[i]=q.parts.map((p,j)=>$('a'+j).value);state['m'+i]=true;showSolutions()}
function showSolutions(){let q=S[i];q.parts.forEach((p,j)=>{let raw=$('a'+j).value,ok=false;if(p.kind==='number'){let n=Number(raw);ok=Number.isFinite(n)&&Number(n.toFixed(p.dp))===Number(p.answer)&&(/^-?\d+\.\d+$/.test(raw.trim())?raw.trim().split('.')[1].length===p.dp:p.dp===0)}else ok=norm(raw)===norm(p.answer)||(p.aliases||[]).some(a=>norm(raw)===norm(a));$('f'+j).innerHTML=`<div class="feedback ${ok?'right':'wrong'}">${ok?'✓ Correct':'✗ Incorrect — Correct answer: '+p.answer}</div><div class=solution>${p.solution}</div>`});if(window.MathJax)MathJax.typesetPromise()}
function go(d){if(i+d>=0&&i+d<S.length){i+=d;render()}}
</script></body></html>
