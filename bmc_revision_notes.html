<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMC Revision Notes</title><style>body{font-family:system-ui;background:#f4f7fb;color:#0b2a63;padding:40px;text-align:center}</style></head><body><strong>GETLOCKEDIN × DOMINANCE</strong><h1>Basic Medical Chemistry</h1><p>Loading Revision Notes…</p><script>async function start(){const p1=await fetch('assets/bmc-notes-1.txt').then(r=>r.text());const p2=await fetch('assets/bmc-notes-2.txt').then(r=>r.text());const data=(p1+p2).trim();const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}start().catch(()=>{document.body.innerHTML='<h1>Unable to load the revision notes</h1><p>Please refresh the page and try again.</p>'});</script></body></html>
