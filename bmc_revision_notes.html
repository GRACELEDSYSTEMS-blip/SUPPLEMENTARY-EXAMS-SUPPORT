<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMC Revision Notes</title><style>html,body{margin:0;min-height:100%;font-family:system-ui;background:#f4f7fb}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#0b2a63;padding:24px;box-sizing:border-box}.loading h1{font-size:clamp(28px,5vw,48px);margin:18px 0}.home{display:inline-block;margin-top:16px;padding:10px 15px;border-radius:9px;background:#0b2a63;color:#fff;text-decoration:none;font-weight:800}</style></head><body><main class="loading" id="status"><div><strong>GETLOCKEDIN × DOMINANCE</strong><h1>Basic Medical Chemistry</h1><p>Loading Revision Notes…</p><noscript><p>JavaScript is required for the interactive notes.</p></noscript></div></main><script>
(async()=>{
 try{
  if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support the notes loader.');
  const paths=['assets/bmc-notes-1.txt','assets/bmc-notes-2.txt'];
  const parts=[];
  for(const path of paths){
   const r=await fetch(path+'?v=20260926-final',{cache:'no-store'});
   if(!r.ok) throw new Error('Could not load notes data ('+r.status+').');
   parts.push(await r.text());
  }
  const encoded=parts.join('').replace(/\s+/g,'');
  const binary=atob(encoded);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  html=html.replace(/href=(['"])\/(?:index\.html)?\1/gi,'href=$1/SUPPLEMENTARY-EXAMS-SUPPORT/index.html$1');
  html=html.replace(/href=(['"])\.\/index\.html\1/gi,'href=$1/SUPPLEMENTARY-EXAMS-SUPPORT/index.html$1');
  document.open();document.write(html);document.close();
 }catch(err){
  console.error(err);
  document.getElementById('status').innerHTML='<div><strong>GETLOCKEDIN × DOMINANCE</strong><h1>Basic Medical Chemistry</h1><p><b>The notes could not load.</b></p><p>'+String(err.message||err)+'</p><a class="home" href="/SUPPLEMENTARY-EXAMS-SUPPORT/index.html">⌂ Home</a></div>';
 }
})();
</script></body></html>
