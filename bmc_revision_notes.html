<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMC Revision Notes</title><style>html,body,#app{width:100%;min-height:100%;margin:0}body{font-family:system-ui;background:#f4f7fb}.loading{padding:40px;text-align:center;color:#0b2a63}.loading a{display:inline-block;padding:10px 14px;border-radius:9px;background:#0b2a63;color:white;text-decoration:none;font-weight:800}</style></head><body><div id="app"><div class="loading"><strong>GETLOCKEDIN × DOMINANCE</strong><h1>Basic Medical Chemistry</h1><p>Loading Revision Notes…</p></div></div><script>async function start(){if(!('DecompressionStream' in window))throw new Error('unsupported');const rs=await Promise.all(['assets/bmc-notes-1.txt','assets/bmc-notes-2.txt'].map(async u=>{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error('asset');return r.text()}));const data=rs.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();document.open();document.write(html);document.close()}start().catch(()=>{document.getElementById('app').innerHTML='<div class="loading"><h1>Unable to load the revision notes</h1><p>Please refresh the page. If the problem continues, update your browser and try again.</p><p><a href="./index.html">⌂ Home</a></p></div>'});</script></body></html>
