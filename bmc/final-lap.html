<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMC Final Lap | GLI × DOMINANCE</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:#0b2a63}.loading h1{font-size:clamp(30px,6vw,52px);margin:10px 0}.loading p{color:#667085}</style></head><body><div id="loading" class="loading"><div><strong>GETLOCKEDIN × DOMINANCE</strong><h1>BMC Final Lap</h1><p>Loading the complete 250-question bank…</p></div></div><script>async function start(){try{if(!('DecompressionStream' in window))throw new Error('This browser does not support the required decompression feature.');const urls=['../assets/bmc-mock-1.txt','../assets/bmc-mock-2.txt'];const parts=[];for(const u of urls){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Question-bank asset failed to load.');parts.push(await r.text())}const data=parts.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();if(!html||html.length<1000)throw new Error('Question bank decompressed to invalid content.');const home=`<a id="siteHomepage" href="../index.html" style="position:fixed;right:14px;bottom:14px;z-index:99999;background:#0b2d6b;color:#fff;border:2px solid #d6ad3b;border-radius:12px;padding:10px 14px;text-decoration:none;font:800 14px system-ui;box-shadow:0 5px 20px #0003">⌂ Homepage</a>`;html=html.replace(/<\/body>/i,home+'</body>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('loading').innerHTML='<div><h1>Unable to load Final Lap</h1><p>'+String(e.message||e)+'</p><p><a href="../index.html">Return to homepage</a></p></div>'}}start();</script></body></html>
