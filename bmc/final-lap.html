new DecompressionStream('gzip'));let html=await new Response(stream).text();if(!html||html.length<1000)throw new Error('Question bank decompressed to invalid content.');const base='<base href="'+new URL('../',location.href).href+'">';html=/<head[^>]*>/i.test(html)?html.replace(/<head([^>]*)>/i,'<head$1>'+base):base+html;const navPatch=`<style id="gli-host-nav">.gli-host-home{position:fixed!important;right:14px!important;bottom:14px!important;z-index:2147483647!important;background:#0b2a63!important;color:#fff!important;border:2px solid #d4af37!important;border-radius:12px!important;padding:10px 14px!important;text-decoration:none!important;font:800 14px system-ui!important;box-shadow:0 5px 20px #0003!important}</style><a class="gli-host-home" href="../index.html" target="_top">⌂ Homepage</a>`;html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,navPatch+'</body>'):html+navPatch;const frame=document.createElement('iframe');frame.srcdoc=html;frame.title='BMC Final Lap';frame.setAttribute('allow','fullscreen');document.getElementById('app').replaceChildren(frame)}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="loading"><h1>Unable to load Final Lap</h1><p>'+String(e.message||e)+'</p><p>Please refresh once. If it persists, use the Homepage button above.</p></div>'}}start();</script></body></html>
