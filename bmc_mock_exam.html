<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMC Supplementary Mock Exam</title><style>html,body,#app{width:100%;height:100%;margin:0}body{font-family:system-ui;background:#f4f7fb;overflow:hidden}.topbar{height:58px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:9px 14px;background:#0b2a63;color:white;border-bottom:3px solid #d4af37}.home{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:9px;background:white;color:#0b2a63;text-decoration:none;font-weight:800;font-size:14px}.brand{font-weight:800;font-size:13px;letter-spacing:.02em}.loading{padding:40px;text-align:center;color:#0b2a63}iframe{display:block;width:100%;height:calc(100vh - 58px);border:0}</style></head><body><header class="topbar"><a class="home" href="./index.html" aria-label="Back to Supplementary Exams Support home">⌂ Home</a><span class="brand">BMC • SUPPLEMENTARY MOCK EXAM</span></header><div id="app"><div class="loading"><strong>GETLOCKEDIN × DOMINANCE</strong><h1>Basic Medical Chemistry</h1><p>Loading Supplementary Mock Exam…</p></div></div><script>async function start(){const p1=await fetch('assets/bmc-mock-1.txt').then(r=>r.text());const p2=await fetch('assets/bmc-mock-2.txt').then(r=>r.text());const data=(p1+p2).trim();const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const frame=document.createElement('iframe');frame.srcdoc=html;frame.title='BMC Supplementary Mock Exam';document.getElementById('app').replaceChildren(frame)}start().catch(()=>{document.getElementById('app').innerHTML='<div class="loading"><h1>Unable to load the mock exam</h1><p>Please refresh the page and try again.</p></div>'});</script></body></html>
