<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMC Supplementary Mock Exam</title><style>html,body,#app{width:100%;height:100%;margin:0}body{font-family:system-ui;background:#f4f7fb;overflow:hidden}.topbar{height:58px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:9px 14px;background:#0b2a63;color:white;border-bottom:3px solid #d4af37}.home{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:9px;background:white;color:#0b2a63;text-decoration:none;font-weight:800;font-size:14px}.brand{font-weight:800;font-size:13px;letter-spacing:.02em}.loading{padding:40px;text-align:center;color:#0b2a63}iframe{display:block;width:100%;height:calc(100vh - 58px);border:0}@media(max-width:520px){.brand{font-size:11px}.home{padding:8px 10px}}</style></head><body><header class="topbar"><a class="home" href="/SUPPLEMENTARY-EXAMS-SUPPORT/index.html" aria-label="Back to Supplementary Exams Support home">⌂ Home</a><span class="brand">BMC • SUPPLEMENTARY MOCK EXAM</span></header><div id="app"><div class="loading"><strong>GETLOCKEDIN × DOMINANCE</strong><h1>Basic Medical Chemistry</h1><p>Loading Supplementary Mock Exam…</p></div></div><script>function addExamFormatter(html){const patch=`<style id="gli-exam-format">.gli-mc-stem{white-space:normal!important;line-height:1.65!important}.gli-mc-stem .gli-statement{display:block;margin:.28rem 0}.gli-ar-stem{white-space:normal!important;line-height:1.6!important}</style><script>(function(){let busy=false;function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function format(){if(busy)return;busy=true;try{document.querySelectorAll('p,div,h2,h3,h4,section,article').forEach(el=>{if(el.children.length>8||el.dataset.gliFmt)return;const t=(el.textContent||'').trim();if(t.length<40||t.length>1800)return;const hasRoman=/\\bi\\.\\s+/i.test(t)&&/\\bii\\.\\s+/i.test(t)&&/\\biii\\.\\s+/i.test(t);if(hasRoman){const m=t.match(/^(.*?)(?:\\s+)(i\\.\\s+.*?)(?:\\s+)(ii\\.\\s+.*?)(?:\\s+)(iii\\.\\s+.*)$/i);if(m){el.dataset.gliFmt='1';el.classList.add('gli-mc-stem');el.innerHTML=esc(m[1])+'<span class="gli-statement">'+esc(m[2])+'</span><span class="gli-statement">'+esc(m[3])+'</span><span class="gli-statement">'+esc(m[4])+'</span>';}}else if(/\\bassertion\\b/i.test(t)&&/\\breason\\b/i.test(t)){el.dataset.gliFmt='1';el.classList.add('gli-ar-stem');}}});}finally{busy=false}}function homeFix(){document.querySelectorAll('a,button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase(),a=(el.getAttribute&&el.getAttribute('aria-label')||'').toLowerCase(),h=(el.getAttribute&&el.getAttribute('href')||'').trim();if(t==='home'||t==='⌂ home'||a.includes('home')||h==='/'||h==='/index.html'){if(el.tagName==='A')el.href='/SUPPLEMENTARY-EXAMS-SUPPORT/index.html';el.dataset.gliHome='1';}})}document.addEventListener('click',e=>{const el=e.target.closest('a,button');if(el&&el.dataset.gliHome==='1'){e.preventDefault();parent.location.href='/SUPPLEMENTARY-EXAMS-SUPPORT/index.html';}},true);new MutationObserver(()=>requestAnimationFrame(()=>{format();homeFix()})).observe(document.documentElement,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',()=>{format();homeFix()});setTimeout(()=>{format();homeFix()},100);setTimeout(()=>{format();homeFix()},700);})();<\/script>`;html=html.replace(/href=(['"])\/(?:index\.html)?\1/gi,'href=$1/SUPPLEMENTARY-EXAMS-SUPPORT/index.html$1');return /<\\/body>/i.test(html)?html.replace(/<\\/body>/i,patch+'</body>'):html+patch}async function start(){if(!('DecompressionStream' in window))throw new Error('unsupported');const rs=await Promise.all(['assets/bmc-mock-1.txt','assets/bmc-mock-2.txt'].map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('asset');return r.text()}));const data=rs.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=addExamFormatter(html);const frame=document.createElement('iframe');frame.srcdoc=html;frame.title='BMC Supplementary Mock Exam';document.getElementById('app').replaceChildren(frame)}start().catch(()=>{document.getElementById('app').innerHTML='<div class="loading"><h1>Unable to load the mock exam</h1><p>Please refresh the page. If the problem continues, update your browser and try again.</p><p><a class="home" href="/SUPPLEMENTARY-EXAMS-SUPPORT/index.html">⌂ Home</a></p></div>'});</script></body></html>
